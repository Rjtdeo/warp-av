<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Warp AV — Scenario Catalog</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f1115;--fg:#e6e6e6;--mut:#9aa0a6;--card:#181b22;--acc:#4fc3f7;--ok:#43a047;--part:#fb8c00;--no:#e53935}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:14px 20px;border-bottom:1px solid #2a2e37;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0}header a{color:var(--acc);text-decoration:none}
.wrap{display:grid;grid-template-columns:420px 1fr;min-height:calc(100vh - 52px)}
.list{border-right:1px solid #2a2e37;overflow:auto;max-height:calc(100vh - 52px)}
.filters{padding:10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid #2a2e37;position:sticky;top:0;background:var(--bg)}
.filters input,.filters select{background:#12151b;color:var(--fg);border:1px solid #2a2e37;padding:6px 8px;border-radius:4px;width:100%}
.row{padding:8px 10px;border-bottom:1px solid #1f232b;cursor:pointer}.row:hover,.row.sel{background:#1c2029}
.row .id{color:var(--mut);font-family:ui-monospace,monospace;font-size:12px}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:11px;color:#000;margin-left:6px}
.implemented{background:var(--ok);color:#fff}.partial{background:var(--part)}.not_implemented{background:var(--no);color:#fff}
.detail{padding:18px 22px;overflow:auto;max-height:calc(100vh - 52px)}
.detail h2{margin:0 0 4px}.mut{color:var(--mut)}.card{background:var(--card);border:1px solid #2a2e37;border-radius:6px;padding:10px 12px;margin:10px 0}
pre{background:#0b0d11;padding:10px;border-radius:6px;overflow:auto;font-size:12px}
.tag{display:inline-block;background:#232833;border-radius:4px;padding:1px 6px;margin:2px;font-size:12px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #2a2e37;padding:4px 6px;text-align:left;font-size:12px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.list{max-height:40vh}}
</style></head><body>
<header><h1>Warp AV · Scenario Catalog</h1><span class="stats" id="stats"></span>
<span style="margin-left:auto"><a href="console.html">Operator console</a> · <a href="docs/SCENARIO_STRATEGY.md">Strategy</a> · <a href="docs/CATALOG.md">CATALOG.md</a> · <a id="gh" href="https://github.com/Rjtdeo/warp-av">GitHub</a></span></header>
<div class="wrap">
<div class="list"><div class="filters">
<input id="q" placeholder="search id / name / tag / description…">
<select id="cat"><option value="">all categories</option></select>
<select id="st"><option value="">all statuses</option><option>implemented</option><option>partial</option><option>not_implemented</option></select>
<select id="town"><option value="">all towns</option></select>
<div class="mut" id="count"></div></div><div id="rows"></div></div>
<div class="detail" id="detail"><p class="mut">Select a scenario. 1000 reproducible scenarios generated by <code>scenarios/generate_catalog.py</code>; each carries ODD, actors, fault/operator events, pass/fail criteria and an honest <b>capability_status</b>.</p></div>
</div>
<script>
let all=[],view=[],sel=null;
const $=id=>document.getElementById(id);
fetch('catalog/scenarios.json').then(r=>r.json()).then(d=>{all=d;init();});
function init(){
  const cats=[...new Set(all.map(s=>s.category))],towns=[...new Set(all.map(s=>s.odd.town))].sort();
  cats.forEach(c=>$('cat').append(new Option(c,c)));towns.forEach(t=>$('town').append(new Option(t,t)));
  const st={};all.forEach(s=>st[s.capability_status]=(st[s.capability_status]||0)+1);
  $('stats').innerHTML=`<span>${all.length} scenarios</span><span>${cats.length} categories</span><span>implemented ${st.implemented||0}</span><span>partial ${st.partial||0}</span><span>not_implemented ${st.not_implemented||0}</span>`;
  ['q','cat','st','town'].forEach(i=>$(i).addEventListener('input',render));
  render();const h=location.hash.slice(1);if(h)show(h);
}
function render(){
  const q=$('q').value.toLowerCase(),c=$('cat').value,s=$('st').value,t=$('town').value;
  view=all.filter(x=>(!c||x.category===c)&&(!s||x.capability_status===s)&&(!t||x.odd.town===t)&&(!q||(x.id+' '+x.name+' '+x.tags.join(' ')+' '+x.description+' '+x.family).toLowerCase().includes(q)));
  $('count').textContent=view.length+' shown';
  $('rows').innerHTML=view.slice(0,400).map(x=>`<div class="row ${sel===x.id?'sel':''}" onclick="show('${x.id}')"><span class="id">${x.id}</span> <span class="badge ${x.capability_status}">${x.capability_status}</span><div>${esc(x.name)}</div><div class="mut">${x.category} · ${x.odd.town} · ${x.odd.weather}</div></div>`).join('')+(view.length>400?'<div class="row mut">…refine filters to see more</div>':'');
}
function show(id){const x=all.find(s=>s.id===id);if(!x)return;sel=id;location.hash=id;render();
  $('detail').innerHTML=`<h2>${x.id} <span class="badge ${x.capability_status}">${x.capability_status}</span></h2><div><b>${esc(x.name)}</b></div><div class="mut">${x.category} / ${x.family} · ${x.odd.town} · ${x.odd.weather} (${x.odd.light}) · ${x.odd.road_type} · limit ${x.odd.speed_limit_mps} m/s · timeout ${x.timeout_s}s</div>
  <div class="card">${esc(x.description)}</div>
  <div>${x.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
  <div class="card"><b>Required capabilities:</b> ${x.required_capabilities.join(', ')}<br><b>Safety boundary:</b> ${esc(x.safety_boundary)}</div>
  <div class="card"><b>Mission</b><pre>${esc(JSON.stringify(x.mission,null,1))}</pre></div>
  ${x.actors.length?`<div class="card"><b>Actors (${x.actors.length})</b><table><tr><th>name</th><th>type</th><th>blueprint</th><th>spawn</th><th>behavior</th><th>trigger</th></tr>${x.actors.map(a=>`<tr><td>${a.name}</td><td>${a.type}</td><td>${a.blueprint}</td><td><code>${esc(JSON.stringify(a.spawn))}</code></td><td><code>${esc(JSON.stringify(a.behavior))}</code></td><td><code>${esc(JSON.stringify(a.trigger||'at start'))}</code></td></tr>`).join('')}</table></div>`:''}
  ${x.events.length?`<div class="card"><b>Events (${x.events.length})</b><table><tr><th>trigger</th><th>action</th><th>params</th></tr>${x.events.map(e=>`<tr><td><code>${esc(JSON.stringify(e.trigger))}</code></td><td>${e.action}</td><td><code>${esc(JSON.stringify(e.params||{}))}</code></td></tr>`).join('')}</table></div>`:''}
  <div class="card"><b>Expected</b><pre>${esc(JSON.stringify(x.expected,null,1))}</pre></div>
  <div class="card"><b>Pass criteria</b><table>${x.pass_criteria.map(c=>`<tr><td>${c.metric}</td><td>${c.op}</td><td><code>${esc(JSON.stringify(c.value))}</code></td></tr>`).join('')}</table><b>Fail criteria</b><table>${x.fail_criteria.map(c=>`<tr><td>${c.metric}</td><td>${c.op}</td><td><code>${esc(JSON.stringify(c.value))}</code></td></tr>`).join('')}</table></div>
  <div class="mut">Run: <code>python3 scenarios/run_scenario.py ${x.id}</code></div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script></body></html>
