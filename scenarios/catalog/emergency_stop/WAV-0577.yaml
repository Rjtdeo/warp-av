id: WAV-0577
name: E-stop clear → resume (hold 10 s)
category: emergency_stop
family: es_clear_and_resume
capability_status: implemented
catalog_version: 1.0.0
description: E-stop, clear after 10 s, operator resumes. Clearing alone must leave vehicle MANUAL (no motion); explicit
  resume re-engages and mission completes.
tags:
- clear
- day
- estop
- resume
- state_machine
required_capabilities:
- estop
- estop_clear_policy
- engage_disengage
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 200
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    ego_speed_gt: 5.0
  action: estop
- trigger:
    after_event: 0
    at_s: 10
  action: estop_clear
- trigger:
    after_event: 1
    at_s: 1.0
  action: resume
expected:
  after_clear: manual, no motion
  after_resume: autonomous
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: resumed_after_clear
  op: ==
  value: true
- metric: mission_completed
  op: ==
  value: true
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: Clearing e-stop never produces motion by itself.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 90
