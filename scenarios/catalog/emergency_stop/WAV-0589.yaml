id: WAV-0589
name: 5 e-stops, 0.2 s apart
category: emergency_stop
family: es_repeated
capability_status: implemented
catalog_version: 1.0.0
description: E-stop/clear/resume cycled 5 times with 0.2 s hold. Checks the state machine has no stuck state and
  the latch is idempotent.
tags:
- day
- estop
- repeated
- state_machine
required_capabilities:
- estop
- state_machine_robustness
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 250
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    at_s: 5.0
  action: estop
- trigger:
    at_s: 5.2
  action: estop_clear
- trigger:
    at_s: 5.5
  action: resume
- trigger:
    at_s: 7.2
  action: estop
- trigger:
    at_s: 7.4
  action: estop_clear
- trigger:
    at_s: 7.7
  action: resume
- trigger:
    at_s: 9.4
  action: estop
- trigger:
    at_s: 9.6
  action: estop_clear
- trigger:
    at_s: 9.9
  action: resume
- trigger:
    at_s: 11.600000000000001
  action: estop
- trigger:
    at_s: 11.8
  action: estop_clear
- trigger:
    at_s: 12.100000000000001
  action: resume
- trigger:
    at_s: 13.8
  action: estop
- trigger:
    at_s: 14.0
  action: estop_clear
- trigger:
    at_s: 14.3
  action: resume
expected:
  no_stuck_state: true
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: safety_states_seen
  op: contains
  value: emergency_stop
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: Every e-stop must brake; every clear must not move the vehicle.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 85
