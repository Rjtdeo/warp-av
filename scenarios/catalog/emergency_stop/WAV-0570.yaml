id: WAV-0570
name: E-stop with pedestrian ahead (Town10HD_Opt) [v2]
category: emergency_stop
family: es_in_turn_and_hazard
capability_status: implemented
catalog_version: 1.0.0
description: E-stop fired as a pedestrian starts crossing 25 m ahead. E-stop must win over everything; reason must
  be e-stop, not pedestrian.
tags:
- day
- estop
- priority_ordering
- with_pedestrian_ahead
required_capabilities:
- estop
- priority_ordering
- estop_latching
odd:
  town: Town10HD_Opt
  weather: ClearNoon
  light: day
  road_type: urban_mixed
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 150
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors:
- name: ped
  type: pedestrian
  blueprint: walker.pedestrian.0001
  spawn:
    mode: route_ahead
    distance_m: 30
    lateral_m: 5.0
    yaw_offset_deg: 0.0
  behavior:
    kind: cross_road
    speed_mps: 1.3
    direction: toward_lane
  trigger:
    ego_within_m: 40
events:
- trigger:
    ego_within_m: 25
  action: estop
expected:
  safety_state: emergency_stop
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: safety_states_seen
  op: contains
  value: emergency_stop
- metric: final_speed_mps
  op: <=
  value: 0.1
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: E-stop overrides all other logic.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 60
