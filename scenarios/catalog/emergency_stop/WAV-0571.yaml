id: WAV-0571
name: E-stop at obstacle stop (Town03) [v2]
category: emergency_stop
family: es_in_turn_and_hazard
capability_status: implemented
catalog_version: 1.0.0
description: Ego already stopped for an obstacle; e-stop pressed. State must change to emergency_stop even though
  speed is 0; clearing must NOT resume into the obstacle.
tags:
- at_obstacle_stop
- day
- estop
- priority_ordering
required_capabilities:
- estop
- priority_ordering
- estop_latching
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_mixed
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 150
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors:
- name: obs
  type: prop
  blueprint: static.prop.streetbarrier
  spawn:
    mode: route_ahead
    distance_m: 30
    lateral_m: 0.0
    yaw_offset_deg: 0.0
  behavior:
    kind: stopped
events:
- trigger:
    on_behavior: stopped_obstacle
  action: estop
expected:
  safety_state: emergency_stop
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: safety_states_seen
  op: contains
  value: emergency_stop
- metric: final_speed_mps
  op: <=
  value: 0.1
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: E-stop overrides all other logic.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 60
