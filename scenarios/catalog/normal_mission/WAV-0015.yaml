id: WAV-0015
name: Normal mission 80 m, Town05, WetNoon, cruise 5.0 m/s
category: normal_mission
family: nm_basic
capability_status: implemented
catalog_version: 1.0.0
description: Ego receives a destination 80 m along the road network in Town05 under WetNoon. No actors. Must follow
  the route, hold ~5.0 m/s, slow near the destination and complete the mission.
tags:
- baseline
- day
- dist_80
- wet_road
required_capabilities:
- route_planning
- path_following
- speed_control
- mission_completion
odd:
  town: Town05
  weather: WetNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 7.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 80
  cruise_speed_mps: 5.0
  start_at_s: 0.0
actors: []
events: []
expected:
  final_mission_state: completed
  behaviors:
  - following_route
  - approaching_destination
  - mission_complete
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: mission_completed
  op: ==
  value: true
- metric: max_speed_mps
  op: <=
  value: 6.5
- metric: route_deviation_max_m
  op: <=
  value: 2.0
- metric: steer_oscillation_index
  op: <=
  value: 3.0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: Never leave the drivable lane; never exceed speed limit by >1.5 m/s.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 100.0
