id: WAV-0769
name: 'Geofence radius 150 m: route exits (Town03) [v2]'
category: odd_boundary
family: ob_geofence
capability_status: not_implemented
catalog_version: 1.0.0
description: Allowed operating area = 150 m radius around start. Destination inside but the only route leaves the
  circle → planner must reject or supervisor must stop at the boundary. Geofencing is listed in KNOWN_ISSUES as
  not implemented — these scenarios define the contract.
tags:
- day
- geofence
- radius_150
- route_exits
required_capabilities:
- geofence
- odd_enforcement
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
  geofence_radius_m: 150
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 250
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events: []
expected:
  target: mission rejected / intervention with reason 'outside allowed operating area'
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: Never operate outside the fence.
data_to_collect:
