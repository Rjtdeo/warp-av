id: WAV-0783
name: 'ODD boundary: weather turns mid mission (Town10HD_Opt) [v2]'
category: odd_boundary
family: ob_speed_and_weather
capability_status: not_implemented
catalog_version: 1.0.0
description: 'Weather switches from clear to heavy rain at night mid-mission. Target: reduce speed automatically;
  raise warning ''ODD: weather degraded''.'
tags:
- day
- odd
- weather_turns_mid_mission
required_capabilities:
- odd_enforcement
- speed_cap
- weather_awareness
odd:
  town: Town10HD_Opt
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 12.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 250
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    ego_speed_gt: 5.0
  action: set_weather
  params:
    preset: HardRainNight
expected:
  target: ODD enforcement
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: Never exceed ODD speed cap.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 120
