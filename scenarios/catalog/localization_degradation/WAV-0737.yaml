id: WAV-0737
name: Localization stale 3.0 s in tunnel then recovers
category: localization_degradation
family: ld_stale_and_loss
capability_status: implemented
catalog_version: 1.0.0
description: 'Localization stops updating for 3.0 s (tunnel; models GNSS loss without dead-reckoning). Threshold
  1 s → intervention. After recovery: resume policy applies.'
tags:
- day
- dur_3.0
- localization
- stale
- tunnel
required_capabilities:
- staleness_detection
- dead_reckoning
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: tunnel
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 200
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    ego_speed_gt: 5.0
  action: inject
  params:
    component: localization
    action: stale
    age_s: 3.0
- trigger:
    after_event: 0
    at_s: 5.0
  action: inject
  params:
    component: localization
    action: enable
expected:
  safety_state: intervention
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: safety_states_seen
  op: contains
  value: intervention
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No driving on a pose older than 1 s.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 60
