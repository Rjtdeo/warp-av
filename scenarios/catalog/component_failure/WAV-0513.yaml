id: WAV-0513
name: vehicle_connection fails during estop
category: component_failure
family: cf_failure_during_estop_and_arrival
capability_status: implemented
catalog_version: 1.0.0
description: E-stop is latched, then vehicle_connection fails while stopped, then the operator clears the e-stop.
  After clearing, the supervisor must still report vehicle_connection unhealthy and refuse motion.
tags:
- day
- during_estop
- fault_injection
- priority_ordering
- vehicle_connection
required_capabilities:
- component_health_monitoring
- estop_latching
- priority_ordering
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 150
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    ego_speed_gt: 5.0
  action: estop
- trigger:
    after_event: 0
    at_s: 2.0
  action: inject
  params:
    component: vehicle_connection
    action: disable
- trigger:
    after_event: 0
    at_s: 6.0
  action: estop_clear
expected:
  safety_state_sequence:
  - emergency_stop
  - intervention
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: safety_states_seen
  op: contains
  value: emergency_stop
- metric: safety_states_seen
  op: contains
  value: intervention
- metric: final_speed_mps
  op: <=
  value: 0.3
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No motion while any fault is active.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 60
