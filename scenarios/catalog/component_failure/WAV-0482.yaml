id: WAV-0482
name: camera fails then recovers after 5 s
category: component_failure
family: cf_recover
capability_status: not_implemented
catalog_version: 1.0.0
description: 'camera disabled at speed, re-enabled 5 s later. Ego must stop on failure and — policy question — either
  resume autonomously (current behaviour: yes, autonomy is still engaged and behaviour resumes) or require operator
  re-engage. Scenario records what happens; the safety doc should state the chosen policy.'
tags:
- after_5
- camera
- day
- fault_injection
- policy_question
- recovery
required_capabilities:
- component_health_monitoring
- recovery_policy
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 200
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    ego_speed_gt: 5.0
  action: inject
  params:
    component: camera
    action: disable
- trigger:
    after_event: 0
    at_s: 5
  action: inject
  params:
    component: camera
    action: enable
expected:
  safety_state: intervention
  then: ok
  resumed_after_clear: policy-dependent
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No motion while unhealthy.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 90
