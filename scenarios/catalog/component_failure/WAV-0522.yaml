id: WAV-0522
name: crash in api
category: component_failure
family: cf_crash_and_invalid
capability_status: not_implemented
catalog_version: 1.0.0
description: 'api.update() raises an exception mid-tick. main loop catches per-tick errors and sleeps — meaning
  the LAST command keeps being applied by CARLA. Target: a tick exception must trigger a brake command and supervisor
  error.'
tags:
- api
- crash
- day
- fault_injection
- software_fault
required_capabilities:
- exception_containment
- command_validation
- monotonic_time
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 200
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    ego_speed_gt: 5.0
  action: inject
  params:
    component: api
    action: crash
expected:
  safety_state: intervention
  target_capability: fail-safe brake on software fault
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: safety_states_seen
  op: contains
  value: intervention
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: A software fault must never leave the last throttle command applied.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 60
