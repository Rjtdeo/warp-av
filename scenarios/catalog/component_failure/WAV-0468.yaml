id: WAV-0468
name: localization freeze (3.0 s old data)
category: component_failure
family: cf_stale_and_freeze
capability_status: implemented
catalog_version: 1.0.0
description: 'localization keeps returning data but its timestamp stops advancing. Supervisor threshold is 1.0 s:
  must trip staleness check. Freeze is the nastier case: values look plausible but are old — exactly what a hung
  sensor driver produces.'
tags:
- age_3.0
- day
- fault_injection
- freeze
- localization
- staleness
required_capabilities:
- staleness_detection
- safe_stop
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 200
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    ego_speed_gt: 5.0
  action: inject
  params:
    component: localization
    action: freeze
    age_s: 3.0
expected:
  safety_state: intervention
  reason_contains: stale
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: safety_states_seen
  op: contains
  value: intervention
- metric: safety_reaction_time_s
  op: <=
  value: 3.5
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: Stale data must never drive the vehicle for more than max_age.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 60
