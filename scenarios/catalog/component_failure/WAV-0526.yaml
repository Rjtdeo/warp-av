id: WAV-0526
name: nan_command in controller
category: component_failure
family: cf_crash_and_invalid
capability_status: not_implemented
catalog_version: 1.0.0
description: 'controller emits NaN/inf (steering=NaN). Vehicle adapter clamps with max/min which does NOT reject
  NaN. Target: command validation rejects NaN → brake.'
tags:
- controller
- day
- fault_injection
- nan_command
- software_fault
required_capabilities:
- exception_containment
- command_validation
- monotonic_time
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 200
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    ego_speed_gt: 5.0
  action: inject
  params:
    component: controller
    action: nan_command
expected:
  safety_state: intervention
  target_capability: fail-safe brake on software fault
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: safety_states_seen
  op: contains
  value: intervention
