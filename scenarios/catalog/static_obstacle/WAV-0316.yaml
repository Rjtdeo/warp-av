id: WAV-0316
name: box appears 22 m ahead at 10.0 m/s
category: static_obstacle
family: so_sudden_appear
capability_status: implemented
catalog_version: 1.0.0
description: 'A box is spawned in the lane when ego is 22 m away while cruising at 10.0 m/s (falls off a truck /
  round a blind corner). Tests raw stopping-distance margin: at 10.0 m/s with ~0.5 s latency and 4 m/s² braking
  ego needs ~17.5 m.'
tags:
- box
- cruise_10.0
- day
- high_severity
- prop
- sudden
- trig_22
required_capabilities:
- obstacle_detection
- emergency_braking
- latency_budget
odd:
  town: Town04
  weather: ClearNoon
  light: day
  road_type: arterial
  speed_limit_mps: 11.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 250
  cruise_speed_mps: 10.0
  start_at_s: 0.0
actors:
- name: obs
  type: prop
  blueprint: static.prop.box03
  spawn:
    mode: route_ahead
    distance_m: 120
    lateral_m: 0.0
    yaw_offset_deg: 0.0
  behavior:
    kind: appear
  trigger:
    ego_within_m: 22
events: []
expected:
  behavior: stopped_obstacle
  may_collide_if: trig < stopping distance at 10.0 m/s
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: behaviors_seen
  op: contains
  value: stopped_obstacle
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: Document the speed/distance pairs that collide — that defines the max safe cruise speed.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 60
