id: WAV-0327
name: barrier just after a curve (Town01, 8.0 m/s)
category: static_obstacle
family: so_after_curve
capability_status: partial
catalog_version: 1.0.0
description: Route chosen to include a bend; barrier placed 8 m past the bend apex. Because the path box is a straight
  3.5 m-wide rectangle in ego frame, an obstacle around a bend may be judged 'out of path' until very late. Route-aware
  in-path check is the target.
tags:
- barrier
- curve
- day
- path_box_limitation
- prop
required_capabilities:
- obstacle_detection
- route_aware_in_path_check
odd:
  town: Town01
  weather: ClearNoon
  light: day
  road_type: curve
  speed_limit_mps: 9.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: spawn_point
    index: 4
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors:
- name: obs
  type: prop
  blueprint: static.prop.streetbarrier
  spawn:
    mode: route_ahead
    distance_m: 60
    lateral_m: 0.0
    after_curve: true
  behavior:
    kind: stopped
events: []
expected:
  behavior: stopped_obstacle
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: behaviors_seen
  op: contains
  value: stopped_obstacle
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No contact.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 90
