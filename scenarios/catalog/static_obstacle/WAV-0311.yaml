id: WAV-0311
name: 2 staggered props from 25 m (slalom-like)
category: static_obstacle
family: so_multi_stagger
capability_status: partial
catalog_version: 1.0.0
description: 2 props alternate ±1 m off centre every 6 m. All inside the path box; ego must stop at the first. A
  lateral-avoidance planner would thread them — not implemented.
tags:
- day
- multi_actor
- prop
- stagger
required_capabilities:
- obstacle_detection
- stop_for_obstacle
- lateral_avoidance
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 145
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors:
- name: obs0
  type: prop
  blueprint: static.prop.barrel
  spawn:
    mode: route_ahead
    distance_m: 25
    lateral_m: 1.0
    yaw_offset_deg: 0.0
  behavior:
    kind: stopped
- name: obs1
  type: prop
  blueprint: static.prop.trafficcone01
  spawn:
    mode: route_ahead
    distance_m: 31
    lateral_m: -1.0
    yaw_offset_deg: 0.0
  behavior:
    kind: stopped
events: []
expected:
  behavior: stopped_obstacle
  target_capability: avoid if clearance allows
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: behaviors_seen
  op: contains
  value: stopped_obstacle
- metric: min_distance_to_actor_m
  op: '>='
  value: 1.0
- metric: stopped_within_s_of_trigger
  op: <=
  value: 6.0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No contact.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 60
