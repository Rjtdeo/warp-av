id: WAV-0284
name: barrel at 40 m, lateral 0.0 m (in path) [v2]
category: static_obstacle
family: so_single_prop
capability_status: implemented
catalog_version: 1.0.0
description: A barrel is placed 40 m ahead offset 0.0 m right of the lane centre. It is inside the path box → ego
  must stop with reason OBSTACLE.
tags:
- barrel
- day
- in_path
- lat_0.0
- overcast
- prop
required_capabilities:
- obstacle_detection
- in_path_check
- stop_for_obstacle
odd:
  town: Town03
  weather: CloudyNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 140
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors:
- name: obs
  type: prop
  blueprint: static.prop.barrel
  spawn:
    mode: route_ahead
    distance_m: 40
    lateral_m: 0.0
    yaw_offset_deg: 0.0
  behavior:
    kind: stopped
events: []
expected:
  behavior: stopped_obstacle
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: behaviors_seen
  op: contains
  value: stopped_obstacle
- metric: min_distance_to_actor_m
  op: '>='
  value: 1.0
- metric: stopped_within_s_of_trigger
  op: <=
  value: 6.0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No contact; no unnecessary stop for shoulder objects.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 60
