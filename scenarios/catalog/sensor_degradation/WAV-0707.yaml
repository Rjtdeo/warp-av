id: WAV-0707
name: camera+gnss both drop
category: sensor_degradation
family: sd_multi_and_flap
capability_status: not_implemented
catalog_version: 1.0.0
description: 'camera and gnss drop simultaneously for 3 s — likely a shared bus/power/network fault. Target: intervention
  + root-cause hint (''multiple sensors lost at once'').'
tags:
- both_drop
- camera
- day
- gnss
- sensor
required_capabilities:
- sensor_health_to_supervisor
- rate_based_health
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 200
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    ego_speed_gt: 5.0
  action: inject
  params:
    component: camera
    action: drop
    duration_s: 3.0
- trigger:
    ego_speed_gt: 5.0
  action: inject
  params:
    component: gnss
    action: drop
    duration_s: 3.0
expected:
  target_safety_state: intervention
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: Documented gap.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 60
