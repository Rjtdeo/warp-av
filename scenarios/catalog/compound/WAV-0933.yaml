id: WAV-0933
name: 'Compound: fog plus pedestrian plus slow lead (Town03)'
category: compound
family: compound
capability_status: partial
catalog_version: 1.0.0
description: Fog, slow van ahead, pedestrian crosses in front of the van. Ego must handle lead + VRU together. Compound
  scenarios exist to catch priority-ordering bugs between independent subsystems.
tags:
- compound
- day
- fog_plus_pedestrian_plus_slow_lead
- priority_ordering
required_capabilities:
- priority_ordering
- multi_hazard
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_mixed
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 200
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors:
- name: lead
  type: vehicle
  blueprint: vehicle.volkswagen.t2
  spawn:
    mode: route_ahead
    distance_m: 20
    lateral_m: 0.0
    yaw_offset_deg: 0.0
  behavior:
    kind: constant_speed
    speed_mps: 3.0
- name: ped
  type: pedestrian
  blueprint: walker.pedestrian.0001
  spawn:
    mode: route_ahead
    distance_m: 60
    lateral_m: 5.0
    yaw_offset_deg: 0.0
  behavior:
    kind: cross_road
    speed_mps: 1.2
    direction: toward_lane
  trigger:
    ego_within_m: 70
events:
- trigger:
    at_s: 0.5
  action: set_weather
  params:
    fog_density: 70
expected:
  behaviors_any:
  - stopped_pedestrian
  - stopped_vehicle
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: min_distance_to_actor_m
  op: '>='
  value: 1.0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No contact with anything.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 120
