id: WAV-0934
name: 'Compound: vehicle ahead then perception fail (Town03)'
category: compound
family: compound
capability_status: partial
catalog_version: 1.0.0
description: Stopped car ahead; perception dies at 18 m. Supervisor must stop the vehicle blind, in time. Compound
  scenarios exist to catch priority-ordering bugs between independent subsystems.
tags:
- compound
- day
- priority_ordering
- vehicle_ahead_then_perception_fail
required_capabilities:
- priority_ordering
- multi_hazard
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_mixed
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 200
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors:
- name: lead
  type: vehicle
  blueprint: vehicle.tesla.model3
  spawn:
    mode: route_ahead
    distance_m: 30
    lateral_m: 0.0
    yaw_offset_deg: 0.0
  behavior:
    kind: stopped
events:
- trigger:
    ego_within_m: 18
  action: inject
  params:
    component: perception
    action: disable
expected:
  behaviors_any:
  - stopped_safety
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: min_distance_to_actor_m
  op: '>='
  value: 1.0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No contact with anything.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 120
