id: WAV-0634
name: Speed limit 8.0 → 12.0 m/s mid-mission (Town05)
category: operator_action
family: oa_speed_limit_change
capability_status: implemented
catalog_version: 1.0.0
description: Operator changes cruise/speed limit from 8.0 to 12.0 m/s while driving. Speed tracking must converge
  within 5 s without overshoot > 1 m/s.
tags:
- 8.0_to_12.0
- day
- live_change
- speed_limit
required_capabilities:
- runtime_config
- speed_control
odd:
  town: Town05
  weather: ClearNoon
  light: day
  road_type: arterial
  speed_limit_mps: 13.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 300
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    ego_speed_gt: 7.5
  action: set_speed_limit
  params:
    cruise_speed_mps: 12.0
expected:
  max_speed_after_change: 13.0
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: max_speed_mps
  op: <=
  value: 13.0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: Never exceed the newer limit by >1 m/s after 5 s.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 120
