id: WAV-0645
name: 3 back-to-back missions, 0.0 s gap
category: operator_action
family: oa_back_to_back
capability_status: implemented
catalog_version: 1.0.0
description: 3 missions issued sequentially, each 0.0 s after the previous completes. Checks mission history grows,
  logger rolls files, behaviour resets (has_mission/mission_complete flags).
tags:
- back_to_back
- day
- logging
- mission_history
required_capabilities:
- mission_state_machine
- logging_rollover
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 80
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    on_mission_state: completed
    at_s: 0.0
  action: start_mission
  params:
    destination:
      mode: route_ahead
      distance_m: 100
- trigger:
    on_mission_state: completed
    at_s: 0.0
  action: start_mission
  params:
    destination:
      mode: route_ahead
      distance_m: 120
expected:
  missions_completed: 3
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: mission_completed
  op: ==
  value: true
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No stale state leaking between missions.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 180
