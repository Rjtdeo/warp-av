id: WAV-0608
name: Pause at 2.0 m/s, resume after 1 s (Town05)
category: operator_action
family: oa_pause_resume
capability_status: implemented
catalog_version: 1.0.0
description: Operator pauses while ego is at 2.0 m/s, holds 1 s, resumes. Pause must disengage (brake to 0), mission
  state → paused; resume re-engages and the mission completes. Route must NOT be re-planned from scratch on resume.
tags:
- day
- hold_1
- mission_state_machine
- pause
- resume
required_capabilities:
- pause_resume
- engage_disengage
- mission_completion
odd:
  town: Town05
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 200
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors: []
events:
- trigger:
    ego_speed_gt: 1.5
  action: pause
- trigger:
    after_event: 0
    at_s: 1
  action: resume
expected:
  mission_state_sequence:
  - executing
  - paused
  - executing
  - completed
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: mission_completed
  op: ==
  value: true
- metric: stop_duration_s
  op: '>='
  value: 0.8
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No motion while paused.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 91
