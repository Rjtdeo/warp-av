id: WAV-0967
name: 'Edge: actor deleted mid stop (Town05)'
category: edge_case
family: edge
capability_status: partial
catalog_version: 1.0.0
description: Lead vehicle is destroyed (despawned) while ego is stopped for it. Perception must drop it cleanly;
  ego resumes.
tags:
- actor_deleted_mid_stop
- boundary_condition
- day
- edge
required_capabilities:
- robustness
- boundary_conditions
odd:
  town: Town05
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 150
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors:
- name: lead
  type: vehicle
  blueprint: vehicle.tesla.model3
  spawn:
    mode: route_ahead
    distance_m: 30
    lateral_m: 0.0
    yaw_offset_deg: 0.0
  behavior:
    kind: remove_after
    delay_s: 4
  trigger:
    on_behavior: stopped_vehicle
events: []
expected:
  no_crash: true
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: mission_completed
  op: ==
  value: true
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No exception escapes the loop; no contact.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 120
