id: WAV-0952
name: 'Edge: object exactly at danger distance (Town03)'
category: edge_case
family: edge
capability_status: partial
catalog_version: 1.0.0
description: Cone at exactly 5.0 m = danger_distance at start. Strict `<` means not blocked → ego would creep. Boundary
  test.
tags:
- boundary_condition
- day
- edge
- object_exactly_at_danger_distance
required_capabilities:
- robustness
- boundary_conditions
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 150
  cruise_speed_mps: 8.0
  start_at_s: 0.0
actors:
- name: obs
  type: prop
  blueprint: static.prop.trafficcone01
  spawn:
    mode: route_ahead
    distance_m: 5.0
    lateral_m: 0.0
    yaw_offset_deg: 0.0
  behavior:
    kind: stopped
events: []
expected:
  no_crash: true
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: min_distance_to_actor_m
  op: '>='
  value: 1.0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No exception escapes the loop; no contact.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 120
