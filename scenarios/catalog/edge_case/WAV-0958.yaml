id: WAV-0958
name: 'Edge: mission while moving manual (Town03)'
category: edge_case
family: edge
capability_status: partial
catalog_version: 1.0.0
description: Mission started while the vehicle still rolls from a previous disengage (non-zero speed at engage).
  Controller PID integral must be reset.
tags:
- boundary_condition
- day
- edge
- mission_while_moving_manual
required_capabilities:
- robustness
- boundary_conditions
odd:
  town: Town03
  weather: ClearNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 8.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 150
  cruise_speed_mps: 8.0
  start_at_s: 4.0
actors: []
events:
- trigger:
    at_s: 0.5
  action: start_mission
  params:
    destination:
      mode: route_ahead
      distance_m: 150
expected:
  no_crash: true
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: No exception escapes the loop; no contact.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 120
