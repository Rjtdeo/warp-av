id: WAV-0070
name: Stopped van 30 m ahead, ego 5.0 m/s, SoftRainNoon
category: vehicle_ahead
family: va_stopped_lead
capability_status: implemented
catalog_version: 1.0.0
description: A stationary van occupies the ego lane 30 m along the route when the mission starts. Ego cruises at
  5.0 m/s, must detect, slow (<15 m) and stop (<5 m) with a reason string naming the vehicle.
tags:
- day
- gap_30
- rain
- stationary_lead
- van
- wet_road
required_capabilities:
- vehicle_detection
- in_path_check
- stop_for_vehicle
odd:
  town: Town03
  weather: SoftRainNoon
  light: day
  road_type: urban_2lane
  speed_limit_mps: 7.0
mission:
  origin:
    mode: ego_current
  destination:
    mode: route_ahead
    distance_m: 150
  cruise_speed_mps: 5.0
  start_at_s: 0.0
actors:
- name: lead
  type: vehicle
  blueprint: vehicle.volkswagen.t2
  spawn:
    mode: route_ahead
    distance_m: 30
    lateral_m: 0.0
    yaw_offset_deg: 0.0
  behavior:
    kind: stopped
events: []
expected:
  behavior: stopped_vehicle
  reason_contains: VEHICLE
pass_criteria:
- metric: collision_count
  op: ==
  value: 0
- metric: behaviors_seen
  op: contains
  value: stopped_vehicle
- metric: min_distance_to_actor_m
  op: '>='
  value: 1.5
- metric: stopped_within_s_of_trigger
  op: <=
  value: 3.2
- metric: behavior_reasons_seen
  op: contains
  value: VEHICLE
fail_criteria:
- metric: collision_count
  op: '>'
  value: 0
safety_boundary: Stop ≥1.5 m behind lead; no contact.
data_to_collect:
- pose
- speed
- behavior
- behavior_reason
- safety_state
- safety_reason
- command
- perception.objects
- perception.closest_distance
- mission.state
- warnings
- errors
- actor_positions
- collisions
timeout_s: 60
