id: WAV-0167
name: Cross traffic from left at 10.0 m/s (Town05)
category: vehicle_ahead
family: va_intersection_crossing
capability_status: not_implemented
catalog_version: 1.0.0
description: 'A car approaches the next intersection from the left at 10.0 m/s, timed to cross as ego arrives. Current
  in-path box (3.5 m wide, forward only) sees it late. Target: intersection right-of-way reasoning.'
tags:
- cross_traffic
- day
- intersection
- left
required_capabilities:
- vehicle_detection
- intersection_handling
- right_of_way
odd:
